[package]
name = "mangareader"
version = "0.1.0"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "mangareader_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = { version = "2.4", default-features = false, features = ["deflate", "deflate64", "bzip2", "zstd"] }
unrar = "0.5.8"
image = { version = "0.24.9", default-features = false, features = ["jpeg", "png", "webp", "gif", "bmp"] }
notify = "6.1"
natord = "1.0"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "system-proxy"] }
tokio = { version = "1", features = ["sync", "macros"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
